name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW-w64 and Make
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 make

      - name: Build DLLs
        run: make

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeadSpaceFovFix-build
          path: |
            build/DeadSpaceFovFix.dll
            build/dinput8.dll
            DeadSpaceFovFix.ini
